<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravador do Podcast — ondas ao vivo</title>
<style>
:root{--bg:#05070d;--fg:#d8f7ff;--mut:#7fa3b3;--acc:#00ffd2;--rec:#ff3b5c;--card:#0d1420;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#f2f6f8;--fg:#0b1a22;--mut:#4d6672;--card:#fff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,"SF Mono",Menlo,monospace}
main{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:4px 0 10px}
canvas{width:100%;max-width:100%;aspect-ratio:16/9;display:block;border-radius:10px;background:#000;border:1px solid #1c2a3a}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button,label.btn{flex:1 1 140px;padding:14px 10px;border-radius:10px;border:1px solid #1f3a48;background:var(--card);color:var(--fg);font:inherit;font-size:14px;text-align:center;cursor:pointer}
button.rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:700}
button:disabled{opacity:.4}
input[type=file]{display:none}
.s{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;align-items:center;font-size:12px;color:var(--mut);background:var(--card);padding:12px;border-radius:10px;border:1px solid #1c2a3a}
input[type=range]{width:100%;accent-color:var(--acc)}
#st{font-size:13px;color:var(--mut);min-height:1.4em;margin:8px 0}
#t{color:var(--rec);font-weight:700}
</style></head><body><main>
<h1>📡 Gravador — ondas ao vivo</h1>
<canvas id="c" width="1280" height="720"></canvas>
<div id="st">Toque em “Ligar microfone”. Fale: a onda segue a sua voz.</div>
<div class="row">
<button id="mic">🎙️ Ligar microfone</button>
<button id="rec" class="rec" disabled>● Gravar</button>
</div>
<div class="row">
<label class="btn">🧍 Minha foto (PNG sem fundo)<input id="foto" type="file" accept="image/*"></label>
<label class="btn">🌌 Trocar fundo<input id="fundo" type="file" accept="image/*"></label>
</div>
<div class="s">
<span>Posição X</span><input id="px" type="range" min="0" max="1" step=".01" value=".38">
<span>Posição Y</span><input id="py" type="range" min="0" max="1" step=".01" value="1">
<span>Tamanho</span><input id="sz" type="range" min=".3" max="1.4" step=".01" value=".9">
<span>Sensibilidade</span><input id="gn" type="range" min=".5" max="6" step=".1" value="2.5">
<span>Altura onda</span><input id="wy" type="range" min=".4" max=".95" step=".01" value=".82">
</div>
<div class="row" id="out" hidden>
<button id="salvar">💾 Salvar vídeo</button>
<button id="share">📤 Compartilhar</button>
</div>
<video id="pv" controls playsinline style="width:100%;border-radius:10px;display:none"></video>
</main>

function cover(img){const r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;x.drawImage(img,(W-w)/2,(H-h)/2,w,h)}

function frame(now){
  const t=now/1000;
  if(bg.complete&&bg.naturalWidth)cover(bg);else{x.fillStyle='#000';x.fillRect(0,0,W,H)}
  if(foto){const s=+$('sz').value*H/foto.height,w=foto.width*s,h=foto.height*s;
    x.drawImage(foto,+$('px').value*(W-w),+$('py').value*(H-h),w,h)}
  let lvl=0,wf=null;
  if(an){an.getFloatTimeDomainData(buf);let q=0;for(const v of buf)q+=v*v;lvl=Math.sqrt(q/buf.length)*+$('gn').value*4;wf=buf}

  layers.forEach(([col,lw,fr,sc],i)=>{
    x.beginPath();

      const y=cy+tp*(H*.16*sc*env*Math.sin(2*Math.PI*fr*u*3-t*(4+2*i))*(.7+.3*Math.sin(t*3+u*8+i))+H*.05*sc*env*raw*8);

    an=ac.createAnalyser();an.fftSize=2048;buf=new Float32Array(an.fftSize);ac.createMediaStreamSource(micStream).connect(an);
    $('mic').textContent='🎙️ Microfone ligado';$('mic').disabled=true;$('rec').disabled=false;st.textContent='Fale alguma coisa. A onda está ouvindo.'}
  catch(e){st.textContent='Microfone bloqueado. No iPhone: Ajustes → Apps → Safari → Microfone → Permitir. Depois recarregue a página.'}};
$('rec').onclick=()=>{
  if(rec&&rec.state==='recording'){rec.stop();return}
  if(!c.captureStream||!window.MediaRecorder){st.textContent='Este navegador não grava vídeo do canvas. Tente o Safari atualizado.';return}
  const vs=c.captureStream(30),ms=new MediaStream([...vs.getVideoTracks(),...micStream.getAudioTracks()]);
  const mt=['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  ext=mt.includes('mp4')?'mp4':'webm';chunks=[];
  try{rec=new MediaRecorder(ms,mt?{mimeType:mt,videoBitsPerSecond:6e6}:{})}catch(e){st.textContent='Não consegui iniciar a gravação: '+e.message;return}
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{blob=new Blob(chunks,{type:mt||'video/'+ext});const pv=$('pv');pv.src=URL.createObjectURL(blob);pv.style.display='block';
    $('out').hidden=false;$('rec').textContent='● Gravar de novo';st.textContent='Pronto. Confira e salve ou compartilhe.'};
  rec.start(1000);t0=performance.now();$('rec').textContent='■ Parar';$('out').hidden=true};
const nome=()=>'podcast-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.'+ext;
$('salvar').onclick=async()=>{
  try{const d=window.claude&&await claude.use('downloads');
    if(d){await d.save({filename:nome(),data:blob});st.textContent='Salvo.';return}}catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome();a.click()};
$('share').onclick=async()=>{
  const f=new File([blob],nome(),{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Podcast'})}catch(e){}}
  else st.textContent='Compartilhar não está disponível aqui. Use Salvar vídeo.'};
</script></body></html>
